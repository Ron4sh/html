<!DOCTYPE html>
<html>
    <head>
        <title> about htmlapi</title>
        <body>
          <h1 style="text-align: center;" >learning about html api</h1> 
            <h2>html geolocation</h2>
            <p>click the button to get your location</p>
            <button onclick="geolocation()">fetch location</button>
            <p id="coordinates"></p>
            <script>
                const x = document.getElementById("coordinates")
                function geolocation(){
                    if (navigator.geolocation){
                        navigator.geolocation.getCurrentPosition(success,error);
                    } else{
                        x.innerHTML = "Geolocation is not support this browser.";
                    }
                }
                function success(position){
                    x.innerHTML = "Latitude;" + position.coords.latitude+
                    "<br> long;"+ position.coords.longitude;
                }
                function error(){
                    alert("unable to retrive your location");
                }
                function error(error) {
  switch(error.code) {
    case error.PERMISSION_DENIED:
      x.innerHTML = "User denied the request for Geolocation."
      break;
    case error.POSITION_UNAVAILABLE:
      x.innerHTML = "Location information is unavailable."
      break;
    case error.TIMEOUT:
      x.innerHTML = "The request to get user location timed out."
      break;
    case error.UNKNOWN_ERROR:
      x.innerHTML = "An unknown error occurred."
      break;
  }
}
            </script>
